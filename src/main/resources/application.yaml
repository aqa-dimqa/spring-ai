server:
  port: ${APP_PORT}

spring:
  application:
    name: spring-ai
  main:
    allow-circular-references: true
#  messages:
#    basename: messages
#    cache-duration: 3600

  ai:
    ollama:
      base-url: ${OLLAMA_URL}
      chat:
        model: ${OLLAMA_CHAT_MODEL}
    vectorstore:
      pgvector:
        schema-name: ${APP_SCHEMA}
        table-name: vector_store
        id-type: uuid
        index-type: HNSW

  datasource:
    url: ${PG_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    hikari:
      connection-init-sql: "set search_path to app;"

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate.jdbc.timezone: UTC
      hibernate.hibernate.format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: flyway
    locations: classpath:db/migration/scripts

app:
  ai:
    max-message-history: ${AI_MAX_MESSAGE_HISTORY}
    document:
      chunk-size: ${DOCUMENT_CHUNK_SIZE}
  user:
    default:
      id: ${DEFAULT_USER_ID}
      username: ${DEFAULT_USERNAME}
